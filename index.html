<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Tempahan PC — Makmal Komputer ADTEC JTM Kampus Tangkak</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>
<style>
* { box-sizing: border-box; }
:root {
  --ink:#F3F5F8; --ink-soft:rgba(243,245,248,.72); --line:rgba(255,255,255,.28);
  --glass:rgba(16,23,34,.55); --glass-soft:rgba(255,255,255,.08);
  --primary:#5B8DEF; --primary-ink:#fff;
  --available:#6FCF97; --pending:#F2A65A; --confirmed:#B18CFF; --maintenance:#C4C8CF; --danger:#F2705A;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
:root[data-theme="light"]{ --ink:#151A22; --ink-soft:rgba(21,26,34,.65); --line:rgba(0,0,0,.14); --glass:rgba(255,255,255,.72); --glass-soft:rgba(0,0,0,.05); }
body{margin:0;background:#070b14;padding:20px 12px;font-family:var(--sans);color:var(--ink);}
:root[data-theme="light"] body{background:#eef2fb;}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(620px 420px at 8% 4%,rgba(91,141,239,.30),transparent 62%),
    radial-gradient(520px 440px at 94% 10%,rgba(177,140,255,.24),transparent 62%),
    radial-gradient(580px 480px at 55% 105%,rgba(111,207,151,.14),transparent 62%);
  animation:aurora 18s ease-in-out infinite alternate;}
:root[data-theme="light"] body::before{opacity:.5;}
@keyframes aurora{to{transform:translate3d(0,-18px,0) scale(1.07);}}
@keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.lab-root{max-width:1000px;margin:0 auto;position:relative;}
.lab-root:has(.admin-shell){max-width:none;}

/* splash */
.splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 50% 35%,rgba(91,141,239,.35),transparent 55%),#05070c;opacity:1;transition:opacity .5s ease;}
.splash.splash-out{opacity:0;pointer-events:none;}
.splash-icon{font-size:44px;filter:drop-shadow(0 0 22px rgba(91,141,239,.7));animation:splashPulse 1.4s ease-in-out infinite;}
@keyframes splashPulse{0%,100%{transform:scale(1);opacity:.85;}50%{transform:scale(1.1);opacity:1;}}
.splash-title{font-size:20px;font-weight:700;margin-top:4px;background:linear-gradient(90deg,#fff,#9db8ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
.splash-sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);}
.splash-bar{width:140px;height:3px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:10px;}
.splash-bar-fill{height:100%;width:36%;background:linear-gradient(90deg,#5B8DEF,#B18CFF);border-radius:999px;animation:splashLoad 1.1s ease-in-out infinite;}
@keyframes splashLoad{0%{transform:translateX(-100%);}100%{transform:translateX(280%);}}

/* header */
.lab-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:18px;}
.lab-title{font-size:21px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,#fff,#9db8ff 60%,#c7b3ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
:root[data-theme="light"] .lab-title{background:linear-gradient(90deg,#151A22,#5B8DEF);-webkit-background-clip:text;background-clip:text;color:transparent;}
.lab-sub{font-size:12px;color:var(--ink-soft);}

/* buttons */
.chip-btn,.mini-btn,.icon-btn,.btn-primary,.btn-secondary,.main-tab,.date-tab,.slot-chip,.pin-key{transition:transform .15s,box-shadow .15s,border-color .15s,background .15s,filter .15s;}
.chip-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--glass-soft);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--ink);}
.chip-btn:hover,.mini-btn:hover,.icon-btn:hover,.btn-secondary:hover{border-color:var(--primary);}
.chip-btn:active,.mini-btn:active,.btn-primary:active{transform:scale(.97);}
.btn-primary,.chip-btn.primary,.main-tab.active{background:linear-gradient(135deg,#5B8DEF,#8B6CF2);border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(91,141,239,.38);}
.btn-primary{width:100%;border:none;border-radius:12px;padding:11px;font-size:13.5px;font-weight:600;cursor:pointer;}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary:not(:disabled):hover,.chip-btn.primary:hover{transform:translateY(-2px);filter:brightness(1.1);box-shadow:0 12px 28px rgba(91,141,239,.5);}
.btn-secondary{width:100%;background:rgba(91,141,239,.12);color:#BFD3FA;border:1px solid var(--primary);border-radius:12px;padding:9px;font-size:13px;cursor:pointer;margin-bottom:12px;}
.mini-btn{font-size:11px;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--glass-soft);cursor:pointer;color:var(--ink);}
.mini-btn.approve{color:var(--confirmed);border-color:rgba(177,140,255,.5);}
.mini-btn.reject{color:var(--danger);border-color:rgba(242,112,90,.5);}
.icon-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--glass-soft);cursor:pointer;color:var(--ink-soft);font-size:12px;}
.icon-btn.danger:hover{color:var(--danger);border-color:var(--danger);}
input:focus{outline:none;border-color:var(--primary)!important;box-shadow:0 0 0 3px rgba(91,141,239,.25);}

/* dashboard cards */
.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;}
.dash-card{position:relative;overflow:hidden;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px 8px 14px;text-align:center;backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);transition:transform .2s,box-shadow .2s;animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards;}
.dash-card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c,var(--primary));}
.dash-card::after{content:"";position:absolute;width:90px;height:90px;right:-28px;bottom:-40px;border-radius:50%;background:var(--c,var(--primary));opacity:.13;filter:blur(8px);}
.dash-card:nth-child(2){animation-delay:.06s}.dash-card:nth-child(3){animation-delay:.12s}.dash-card:nth-child(4){animation-delay:.18s}
.dash-card:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(0,0,0,.35);}
.dash-card.available{--c:var(--available)}.dash-card.pending{--c:var(--pending)}.dash-card.confirmed{--c:var(--confirmed)}.dash-card.maintenance{--c:var(--maintenance)}
.dash-num{font-size:30px;line-height:1.1;font-weight:800;font-family:var(--mono);}
.dash-lbl{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
.dash-card.available .dash-num{color:var(--available);text-shadow:0 0 20px rgba(111,207,151,.5);}
.dash-card.pending .dash-num{color:var(--pending);text-shadow:0 0 20px rgba(242,166,90,.5);}
.dash-card.confirmed .dash-num{color:var(--confirmed);text-shadow:0 0 20px rgba(177,140,255,.5);}
.dash-card.maintenance .dash-num{color:var(--maintenance);}

/* banner */
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:13px;border:1px solid var(--pending);background:rgba(242,166,90,.15);color:#ffe3c2;animation:rise .5s backwards;}
.banner.crit{border-color:var(--danger);background:rgba(242,112,90,.18);color:#ffd6ce;animation:rise .5s backwards,critPulse 1.2s ease-in-out infinite;}
.banner b{font-family:var(--mono);}
@keyframes critPulse{0%,100%{box-shadow:0 0 0 0 rgba(242,112,90,.5);}50%{box-shadow:0 0 0 8px rgba(242,112,90,0);}}
:root[data-theme="light"] .banner{color:#7a3b00;}
:root[data-theme="light"] .banner.crit{color:#8a1f0d;}

/* tabs */
.date-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;}
.date-tab{display:flex;flex-direction:column;align-items:center;min-width:56px;padding:9px 6px;border-radius:14px;border:1px solid var(--line);background:var(--glass-soft);cursor:pointer;font-family:var(--mono);color:var(--ink-soft);flex-shrink:0;}
.date-tab .date-num{font-size:15px;font-weight:700;color:var(--ink);}
.date-tab:hover{transform:translateY(-2px);border-color:var(--primary);}
.date-tab.active{border-color:var(--primary);background:linear-gradient(160deg,rgba(91,141,239,.42),rgba(139,108,242,.28));box-shadow:0 8px 20px rgba(91,141,239,.30);}
.date-tab.active .date-num{color:#fff;}
:root[data-theme="light"] .date-tab.active .date-num{color:#1d3f9a;}
.main-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.main-tab{border:1px solid var(--line);background:var(--glass);color:var(--ink-soft);padding:9px 18px;border-radius:999px;cursor:pointer;font-weight:700;font-size:12px;}

/* layout + glass panels */
.lab-body{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start;}
@media (max-width:720px){.lab-body{grid-template-columns:1fr;}.dash{grid-template-columns:repeat(2,1fr);}}
.floor-wrap,.panel,.admin-panel-card{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:16px;backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:0 12px 44px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.09);animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards;}
.panel{animation-delay:.1s;}
.admin-panel-card{padding:18px;}
:root[data-theme="light"] .floor-wrap,:root[data-theme="light"] .panel,:root[data-theme="light"] .admin-panel-card{box-shadow:0 10px 34px rgba(30,50,90,.12),inset 0 1px 0 #fff;}

/* PC board */
.board-screen{text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft);border:1px solid rgba(91,141,239,.4);background:linear-gradient(90deg,transparent,rgba(91,141,239,.12),transparent);box-shadow:0 0 18px rgba(91,141,239,.18);border-radius:6px;padding:5px;margin-bottom:12px;}
.board-grid{display:grid;gap:10px;}
.pc-cell{font-family:var(--mono);font-size:12px;font-weight:700;aspect-ratio:1;border-radius:12px;border:1.5px solid var(--line);background:var(--glass-soft);color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s;}
.pc-cell:not(.maintenance):hover{transform:translateY(-3px) scale(1.08);}
.pc-cell.available{border-color:rgba(111,207,151,.55);color:var(--available);background:rgba(111,207,151,.14);}
.pc-cell.available:hover{box-shadow:0 8px 20px rgba(111,207,151,.40);}
.pc-cell.pending{border-color:rgba(242,166,90,.55);color:var(--pending);background:rgba(242,166,90,.16);box-shadow:0 0 14px rgba(242,166,90,.28);}
.pc-cell.confirmed{border-color:rgba(177,140,255,.55);color:var(--confirmed);background:rgba(177,140,255,.18);box-shadow:0 0 16px rgba(177,140,255,.38);}
.pc-cell.maintenance{border-color:rgba(255,255,255,.22);color:var(--maintenance);background:rgba(255,255,255,.05);cursor:not-allowed;}
.pc-cell.selected{border-color:var(--primary);background:linear-gradient(135deg,#5B8DEF,#8B6CF2);color:#fff;box-shadow:0 0 0 3px rgba(91,141,239,.35),0 10px 24px rgba(91,141,239,.5);transform:scale(1.08);}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:11px;color:var(--ink-soft);}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block;}
.dot.available{background:var(--available);}.dot.pending{background:var(--pending);}
.dot.confirmed{background:var(--confirmed);}.dot.maintenance{background:var(--maintenance);}.dot.selected{background:var(--primary);}

/* panel content */
.panel-eyebrow{font-size:11px;color:var(--ink-soft);}
.panel-title{font-size:15px;font-weight:700;margin:2px 0 12px;font-family:var(--mono);}
.muted{font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
.divider{height:1px;background:var(--line);margin:14px 0;}
.slot-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:14px;}
.slot-chip{font-family:var(--mono);font-size:11.5px;padding:9px 6px;border-radius:10px;border:1px solid var(--line);background:var(--glass-soft);color:var(--ink);cursor:pointer;}
.slot-chip:not(:disabled):hover{border-color:var(--primary);transform:translateY(-1px);}
.slot-chip.pending{color:var(--pending);border-color:rgba(242,166,90,.5);cursor:not-allowed;}
.slot-chip.confirmed{color:var(--confirmed);border-color:rgba(177,140,255,.5);cursor:not-allowed;}
.slot-chip.past{opacity:.4;cursor:not-allowed;}
.slot-chip.sel{background:linear-gradient(135deg,#5B8DEF,#8B6CF2);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(91,141,239,.4);}
.form-fields{display:flex;flex-direction:column;gap:9px;margin-bottom:12px;}
.form-fields label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--ink-soft);}
.form-fields input,.qr-row input{font-size:13px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);transition:border-color .15s,box-shadow .15s;}

/* bookings + lists */
.my-bookings,.admin-bookings,.admin-pcs{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px;}
.admin-bookings,.admin-pcs{max-height:400px;overflow-y:auto;}
.my-bookings li,.admin-bookings li,.admin-pcs li,.report-item{background:var(--glass-soft);border:1px solid var(--line);border-radius:12px;padding:9px;transition:transform .15s,border-color .15s;}
.my-bookings li:hover,.admin-bookings li:hover,.admin-pcs li:hover{transform:translateX(3px);border-color:rgba(91,141,239,.5);}
.report-item{margin-bottom:6px;}
.mb-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.mb-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;}
.mb-pc{font-weight:700;color:var(--ink);}
.qr-row{display:flex;gap:6px;margin-top:7px;}
.qr-row input{flex:1;font-family:var(--mono);font-size:12px;padding:6px 8px;}
.qr-code-hint{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin-top:4px;}
.sess-bar{width:100%;height:7px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;}
.sess-bar-fill{height:100%;border-radius:999px;transition:width 1s linear;}
.qr-img-box{background:#fff;padding:6px;border-radius:12px;display:inline-block;line-height:0;box-shadow:0 8px 22px rgba(0,0,0,.4);}
.qr-block{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap;}
.qr-side{display:flex;flex-direction:column;gap:6px;}
.cam-video{width:100%;border-radius:10px;background:#000;aspect-ratio:1;object-fit:cover;}
.scan-feedback{margin-top:10px;font-size:12.5px;padding:8px 10px;border-radius:8px;background:var(--glass-soft);border:1px solid var(--line);}
.scan-feedback.err{color:var(--danger);border-color:rgba(242,112,90,.4);}
.scan-feedback.ok{color:var(--confirmed);border-color:rgba(177,140,255,.4);}
.status-badge{font-size:10px;padding:4px 9px;font-weight:600;letter-spacing:.02em;border-radius:999px;white-space:nowrap;}
.status-badge.pending,.status-badge.approved{color:var(--pending);background:rgba(242,166,90,.16);border:1px solid rgba(242,166,90,.4);}
.status-badge.confirmed{color:var(--confirmed);background:rgba(177,140,255,.16);border:1px solid rgba(177,140,255,.4);}
.status-badge.rejected{color:var(--danger);background:rgba(242,112,90,.14);border:1px solid rgba(242,112,90,.4);}
.ab-row{display:flex;justify-content:space-between;gap:8px;margin-bottom:7px;}
.ab-top{font-family:var(--mono);font-size:12px;font-weight:700;}
.ab-sub{font-size:11px;color:var(--ink-soft);}
.report-item .ab-sub{margin-top:3px;}
.ab-actions{display:flex;gap:6px;}
.admin-pcs li{display:flex;align-items:center;gap:8px;padding:7px 9px;}
.ap-label{font-family:var(--mono);font-size:12px;width:58px;}
.status-btn{flex:1;font-size:11px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.05);padding:5px;cursor:pointer;color:var(--available);}
.status-btn.maintenance{color:var(--maintenance);border-color:var(--maintenance);}
.audit-item{font-size:11px;color:var(--ink-soft);border-bottom:1px dashed var(--line);padding:6px 0;}
.audit-item b{color:var(--ink);}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.stat-box{background:var(--glass-soft);border:1px solid var(--line);border-radius:14px;padding:10px;transition:transform .2s;}
.stat-box:hover{transform:translateY(-3px);}
.stat-box .n{font-family:var(--mono);font-size:22px;font-weight:800;background:linear-gradient(90deg,var(--primary),var(--confirmed));-webkit-background-clip:text;background-clip:text;color:transparent;}
.stat-box .l{font-size:10.5px;color:var(--ink-soft);}

/* toast */
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(12,18,28,.92);border:1px solid var(--line);color:#fff;font-size:13px;padding:10px 16px;border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.45);z-index:50;animation:toastIn .3s cubic-bezier(.2,.8,.2,1);}
.toast.err{background:rgba(242,112,90,.9);}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px);}}

/* admin PIN gate */
.admin-gate{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 12%,rgba(91,141,239,.35),transparent 55%),#05070c;}
.admin-gate-card{width:100%;max-width:340px;background:rgba(16,23,34,.72);border:1px solid rgba(91,141,239,.35);border-radius:24px;padding:26px 22px 22px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 60px rgba(91,141,239,.18);backdrop-filter:blur(8px);}
.admin-gate-card.shakecard{animation:gateshake .35s;}
@keyframes gateshake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.admin-gate-icon{width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,#5B8DEF,#8B6CF2);display:flex;align-items:center;justify-content:center;font-size:25px;margin:0 auto 14px;box-shadow:0 8px 22px rgba(91,141,239,.45);animation:floaty 3.2s ease-in-out infinite;}
@keyframes floaty{50%{transform:translateY(-5px);}}
.admin-gate-title{font-size:18px;font-weight:800;margin-bottom:3px;color:#F3F5F8;}
.admin-gate-sub{font-size:12px;color:rgba(243,245,248,.72);margin-bottom:20px;}
.pin-dots{display:flex;gap:11px;justify-content:center;margin-bottom:10px;}
.pin-dot{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,255,255,.28);background:transparent;transition:all .15s;}
.pin-dot.filled{background:var(--primary);border-color:var(--primary);box-shadow:0 0 10px rgba(91,141,239,.8);transform:scale(1.15);}
.pin-dot.err{border-color:var(--danger);}
.admin-gate-error{font-size:11.5px;color:var(--danger);min-height:15px;margin-bottom:8px;}
.pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.pin-key{font-family:var(--mono);font-size:17px;padding:13px 0;border-radius:14px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#F3F5F8;cursor:pointer;}
.pin-key:hover{border-color:var(--primary);background:rgba(91,141,239,.16);transform:translateY(-1px);}
.pin-key:active{background:rgba(91,141,239,.28);}
.pin-key.wide{font-size:11.5px;}
.admin-gate-back{margin-top:14px;background:none;border:none;color:rgba(243,245,248,.72);font-size:12px;cursor:pointer;text-decoration:underline;}

/* admin dashboard page */
.admin-shell{min-height:100vh;margin:-20px -12px;display:flex;background:transparent;}
.admin-sidebar{width:208px;flex-shrink:0;background:rgba(9,13,21,.55);border-right:1px solid var(--line);padding:20px 13px;display:flex;flex-direction:column;gap:4px;backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);}
:root[data-theme="light"] .admin-sidebar{background:rgba(255,255,255,.65);}
.admin-brand{display:flex;align-items:center;gap:10px;margin-bottom:20px;padding:0 4px;}
.admin-brand-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#5B8DEF,#8B6CF2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;box-shadow:0 8px 20px rgba(91,141,239,.5);}
.admin-brand-text b{display:block;font-size:13px;line-height:1.2;}
.admin-brand-text span{font-size:10px;color:var(--ink-soft);}
.admin-nav-item{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:12px;border:none;background:transparent;color:var(--ink-soft);font-size:12.5px;cursor:pointer;text-align:left;width:100%;transition:background .15s,transform .15s;}
.admin-nav-item:hover{background:var(--glass-soft);color:var(--ink);transform:translateX(3px);}
.admin-nav-item.active{background:linear-gradient(90deg,rgba(91,141,239,.28),rgba(91,141,239,.04));color:#fff;border-left:3px solid var(--primary);padding-left:8px;font-weight:600;box-shadow:0 6px 18px rgba(91,141,239,.22);}
:root[data-theme="light"] .admin-nav-item.active{color:#1d3f9a;}
.admin-nav-pill{margin-left:auto;background:var(--pending);color:#2A1B05;font-size:10px;font-weight:700;border-radius:999px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.admin-nav-spacer{flex:1;}
.admin-exit{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--glass-soft);color:var(--ink-soft);font-size:12px;cursor:pointer;}
.admin-main{flex:1;padding:22px 24px 40px;min-width:0;overflow-x:hidden;}
.admin-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.admin-topbar h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0;background:linear-gradient(90deg,var(--ink),#9db8ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
@media (max-width:820px){
  .admin-shell{flex-direction:column;}
  .admin-sidebar{width:100%;flex-direction:row;overflow-x:auto;align-items:center;padding:10px;gap:6px;}
  .admin-brand{margin-bottom:0;}
  .admin-nav-spacer{display:none;}
  .admin-nav-item{white-space:nowrap;width:auto;}
  .admin-nav-item.active{border-left:none;border-bottom:3px solid var(--primary);padding-left:11px;}
  .admin-exit{white-space:nowrap;}
  .admin-main{padding:16px;}
}

/* scrollbar + reduced motion */
*{scrollbar-width:thin;scrollbar-color:rgba(91,141,239,.45) transparent;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:rgba(91,141,239,.4);border-radius:999px;}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;
const pad = n => String(n).padStart(2,"0");
const WD = ["Ahad","Isnin","Selasa","Rabu","Khamis","Jumaat","Sabtu"];
const MO = ["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogo","Sep","Okt","Nov","Dis"];
const STATUS_LABEL = { pending:"Menunggu Kelulusan", approved:"Lulus - Sila Imbas QR", confirmed:"Sesi Aktif", rejected:"Ditolak" };
const SESSION_MS = 60*60*1000;       // 60 min session once QR scanned
const CHECKIN_WINDOW_MS = 5*60*1000; // 5 min to check in after approval
const EXTEND_MS = 30*60*1000;        // one-time +30 min extension

function isoOf(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function generateDates(count=7){
  const out=[]; const base=new Date(); base.setHours(0,0,0,0);
  for(let i=0;i<count;i++){ const d=new Date(base); d.setDate(base.getDate()+i);
    out.push({iso:isoOf(d),weekday:WD[d.getDay()],day:d.getDate(),month:MO[d.getMonth()]}); }
  return out;
}
const DEFAULT_SLOTS = Array.from({length:14},(_,i)=>{const h=8+i;return `${pad(h)}:00-${pad(h+1)}:00`;});
function defaultPCs(){ const pcs=[]; let n=1;
  for(let r=0;r<4;r++) for(let c=0;c<6;c++){ pcs.push({id:`pc-${n}`,label:`PC-${pad(n)}`,row:r,col:c,status:"active"}); n++; }
  return pcs;
}
function uid(){ return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`; }
function genQR(){ return Math.random().toString(36).slice(2,8).toUpperCase(); }
const TODAY_ISO = isoOf(new Date());
const CURRENT_HOUR = new Date().getHours();

function storageGet(k){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):null; }catch{ return null; } }
function storageSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch{ return false; } }
const KEY_PCS="lab_pcs_v2", KEY_BOOKINGS="lab_bookings_v3", KEY_PIN="lab_admin_pin_v1", KEY_PROFILE="lab_profile_v1", KEY_SLOTS="lab_slots_v1", KEY_THEME="lab_theme_v1", KEY_AUDIT="lab_audit_v1", KEY_REPORTS="lab_reports_v1";
function logAudit(actor,action,detail){
  const fresh=storageGet(KEY_AUDIT)||[];
  const updated=[{id:uid(),ts:Date.now(),actor,action,detail},...fresh].slice(0,200);
  storageSet(KEY_AUDIT,updated);
  return updated;
}
function fmtRemain(ms){ if(ms<=0) return "00:00"; const s=Math.floor(ms/1000); return `${pad(Math.floor(s/60))}:${pad(s%60)}`; }

function LabReservation(){
  const dates = useMemo(()=>generateDates(7),[]);
  const [selectedDate,setSelectedDate]=useState(TODAY_ISO);
  const [role,setRole]=useState("user");
  const [pcs,setPcs]=useState([]); const [bookings,setBookings]=useState([]);
  const [loading,setLoading]=useState(true); const [busy,setBusy]=useState(false);
  const [selectedPcId,setSelectedPcId]=useState(null); const [selectedSlots,setSelectedSlots]=useState([]);
  const [name,setName]=useState(""); const [matric,setMatric]=useState("");
  const [toast,setToast]=useState(null); const [adminTab,setAdminTab]=useState("bookings");
  const [userTab,setUserTab]=useState("book"); const [slots,setSlots]=useState(DEFAULT_SLOTS);
  const [now,setNow]=useState(Date.now());
  const [theme,setTheme]=useState(()=>storageGet(KEY_THEME)||"dark");
  useEffect(()=>{ document.documentElement.setAttribute("data-theme",theme); storageSet(KEY_THEME,theme); },[theme]);
  const [reports,setReports]=useState([]);
  const [minSplashDone,setMinSplashDone]=useState(false);
  const [splashRemoved,setSplashRemoved]=useState(false);
  const splashActive = loading || !minSplashDone;

  useEffect(()=>{ const t=setTimeout(()=>setMinSplashDone(true),1400); return ()=>clearTimeout(t); },[]);
  useEffect(()=>{ if(!splashActive){ const t=setTimeout(()=>setSplashRemoved(true),500); return ()=>clearTimeout(t); } },[splashActive]);

  const showToast=useCallback((text,kind="ok")=>{ setToast({text,kind}); clearTimeout(showToast._t); showToast._t=setTimeout(()=>setToast(null),2800); },[]);

  useEffect(()=>{
    let p=storageGet(KEY_PCS); if(!p){ p=defaultPCs(); storageSet(KEY_PCS,p); }
    let b=storageGet(KEY_BOOKINGS); if(!b){ b=[]; storageSet(KEY_BOOKINGS,b); }
    let s=storageGet(KEY_SLOTS); if(!s||!s.length){ s=DEFAULT_SLOTS; storageSet(KEY_SLOTS,s); }
    setSlots(s);
    if(!storageGet(KEY_PIN)) storageSet(KEY_PIN,{pin:"1234"});
    const prof=storageGet(KEY_PROFILE); if(prof){ setName(prof.name||""); setMatric(prof.matric||""); }
    setPcs(p); setBookings(b); setReports(storageGet(KEY_REPORTS)||[]); setLoading(false);
  },[]);

  // ---- ticking clock: countdowns + auto-release + session expiry ----
  useEffect(()=>{
    const t=setInterval(()=>{
      setNow(Date.now());
      const fresh=storageGet(KEY_BOOKINGS)||[];
      let changed=false;
      const updated=fresh.map(b=>{
        if(b.status==="approved" && b.approvedAt && Date.now()-b.approvedAt>CHECKIN_WINDOW_MS){
          changed=true;
          return {...b,status:"rejected",reason:"Dilepaskan automatik - tidak imbas QR dalam masa 5 minit"};
        }
        if(b.status==="confirmed" && b.qrConfirmedAt && Date.now()-b.qrConfirmedAt>SESSION_MS+(b.extraMs||0)){
          changed=true;
          return {...b,status:"rejected",reason:"Sesi tamat"};
        }
        return b;
      });
      if(changed){ storageSet(KEY_BOOKINGS,updated); setBookings(updated); }
    },5000);
    return ()=>clearInterval(t);
  },[]);

  const refreshBookings=useCallback(()=>setBookings(storageGet(KEY_BOOKINGS)||[]),[]);
  const bookingsForDate=useMemo(()=>bookings.filter(b=>b.date===selectedDate),[bookings,selectedDate]);
  const activeBookingsForDate=useMemo(()=>bookingsForDate.filter(b=>b.status!=="rejected"),[bookingsForDate]);
  const slotKey=(pcId,slot)=>`${pcId}__${slot}`;
  const slotStatusMap=useMemo(()=>{ const m=new Map(); activeBookingsForDate.forEach(b=>m.set(slotKey(b.pcId,b.slot),b.status)); return m; },[activeBookingsForDate]);
  const selectedPc=pcs.find(p=>p.id===selectedPcId)||null;
  const myBookings=useMemo(()=>{ if(!matric) return []; return bookingsForDate.filter(b=>b.matric.trim().toLowerCase()===matric.trim().toLowerCase()); },[bookingsForDate,matric]);

  // ---- dashboard counts (per selected date) ----
  const dash=useMemo(()=>{
    let available=0,pending=0,confirmed=0,maintenance=0;
    pcs.forEach(pc=>{
      if(pc.status==="maintenance"){ maintenance++; return; }
      const pcActive=activeBookingsForDate.filter(b=>b.pcId===pc.id);
      if(pcActive.some(b=>b.status==="confirmed")) confirmed++;
      else if(pcActive.some(b=>b.status==="pending"||b.status==="approved")) pending++;
      else available++;
    });
    return {available,pending,confirmed,maintenance};
  },[pcs,activeBookingsForDate]);

  // ---- session expiry banner ----
  const myActiveSession=useMemo(()=>{
    if(!matric) return null;
    return bookings.find(b=>b.status==="confirmed" && b.matric.trim().toLowerCase()===matric.trim().toLowerCase() && b.qrConfirmedAt);
  },[bookings,matric]);
  const remainMs = myActiveSession ? (myActiveSession.qrConfirmedAt+SESSION_MS+(myActiveSession.extraMs||0)-now) : null;
  const showBanner = remainMs!==null && remainMs>0 && remainMs<=5*60*1000;
  const crit = showBanner && remainMs<=60*1000;

  function slotDisabled(slot){ if(selectedDate===TODAY_ISO){ const sh=parseInt(slot.slice(0,2),10); if(sh<CURRENT_HOUR) return true; } return false; }
  function pickPc(pc){ if(pc.status==="maintenance") return; setSelectedPcId(pc.id); setSelectedSlots([]); }
  function toggleSlot(slot){ if(slotStatusMap.has(slotKey(selectedPcId,slot))) return; if(slotDisabled(slot)) return;
    setSelectedSlots(p=> p.includes(slot)? p.filter(s=>s!==slot) : [...p,slot].sort()); }

  function confirmBooking(){
    if(!selectedPc||selectedSlots.length===0||!name.trim()||!matric.trim()){ showToast("Sila lengkapkan PC, slot, nama dan no. matrik.","err"); return; }
    setBusy(true);
    const fresh=storageGet(KEY_BOOKINGS)||[];
    const conflict=selectedSlots.some(slot=>fresh.some(b=>b.pcId===selectedPc.id&&b.date===selectedDate&&b.slot===slot&&b.status!=="rejected"));
    if(conflict){ setBookings(fresh); showToast("Sekurang-kurangnya satu slot telah ditempah. Pilih semula.","err"); setBusy(false); return; }
    const groupId=uid(); const stamp=selectedDate.replaceAll("-",""); const seq=String(fresh.length+1).padStart(3,"0"); const no=`PS-${stamp}-${seq}`;
    const entries=selectedSlots.map((slot,idx)=>({
      id:uid(),groupId,bookingNo:selectedSlots.length>1?`${no}-${idx+1}`:no,
      pcId:selectedPc.id,pcLabel:selectedPc.label,date:selectedDate,slot,name:name.trim(),matric:matric.trim(),
      status:"pending",reason:"",qrCode:genQR(),createdAt:Date.now(),approvedAt:null,qrConfirmedAt:null,
    }));
    const updated=[...fresh,...entries];
    if(storageSet(KEY_BOOKINGS,updated)){ setBookings(updated); storageSet(KEY_PROFILE,{name:name.trim(),matric:matric.trim()}); setSelectedSlots([]); showToast("Permohonan dihantar. Menunggu kelulusan admin.","ok"); }
    else showToast("Gagal menghantar. Cuba lagi.","err");
    setBusy(false);
  }

  function cancelBooking(id){ setBusy(true); const fresh=storageGet(KEY_BOOKINGS)||[]; const updated=fresh.filter(b=>b.id!==id);
    if(storageSet(KEY_BOOKINGS,updated)){ setBookings(updated); showToast("Tempahan dibuang.","ok"); } else showToast("Gagal. Cuba lagi.","err"); setBusy(false); }

  function setBookingStatus(id,status,reason=""){
    setBusy(true); const fresh=storageGet(KEY_BOOKINGS)||[];
    const updated=fresh.map(b=>{
      if(b.id!==id) return b;
      if(status==="approved") return {...b,status,reason:"",approvedAt:Date.now()};
      return {...b,status,reason};
    });
    if(storageSet(KEY_BOOKINGS,updated)){ setBookings(updated); showToast(status==="approved"?"Diluluskan. Pengguna ada 5 min untuk imbas QR.":"Ditolak.","ok"); logAudit("Admin",status==="approved"?"Lulus Tempahan":"Tolak Tempahan",`${id}${reason?" — "+reason:""}`); }
    else showToast("Gagal kemaskini.","err");
    setBusy(false);
  }

  function adminConfirmByCode(code,feedback){
    const fresh=storageGet(KEY_BOOKINGS)||bookings;
    const target=fresh.find(b=>b.qrCode===code.trim().toUpperCase());
    if(!target){ feedback("Kod tidak dijumpai.","err"); return; }
    if(target.status==="confirmed"){ feedback(`${target.pcLabel} — sesi sudah aktif.`,"err"); return; }
    if(target.status!=="approved"){ feedback("Tempahan ini tidak sah untuk didaftar masuk.","err"); return; }
    const updated=fresh.map(b=>b.id===target.id?{...b,status:"confirmed",qrConfirmedAt:Date.now()}:b);
    if(storageSet(KEY_BOOKINGS,updated)){ setBookings(updated); feedback(`✓ ${target.pcLabel} · ${target.name} — sesi dimulakan!`,"ok"); showToast(`${target.pcLabel} — sesi dimulakan`,"ok"); logAudit("Admin","Daftar Masuk",`${target.pcLabel} · ${target.matric}`); }
    else feedback("Gagal simpan.","err");
  }

  function extendSession(id){
    setBusy(true); const fresh=storageGet(KEY_BOOKINGS)||bookings;
    const target=fresh.find(b=>b.id===id);
    if(!target || target.status!=="confirmed"){ showToast("Sesi ini tidak aktif.","err"); setBusy(false); return; }
    if(target.extendedOnce){ showToast("Sesi ini sudah pernah dilanjutkan.","err"); setBusy(false); return; }
    const updated=fresh.map(b=>b.id===id?{...b,extraMs:(b.extraMs||0)+EXTEND_MS,extendedOnce:true}:b);
    if(storageSet(KEY_BOOKINGS,updated)){ setBookings(updated); showToast("Sesi dilanjutkan 30 minit.","ok"); }
    setBusy(false);
  }
  function endSessionEarly(id){
    setBusy(true); const fresh=storageGet(KEY_BOOKINGS)||bookings;
    const target=fresh.find(b=>b.id===id);
    if(!target || target.status!=="confirmed"){ setBusy(false); return; }
    const updated=fresh.map(b=>b.id===id?{...b,status:"rejected",reason:"Sesi ditamatkan awal oleh pengguna"}:b);
    if(storageSet(KEY_BOOKINGS,updated)){ setBookings(updated); showToast(`Terima kasih! ${target.pcLabel} kini dibebaskan.`,"ok"); }
    setBusy(false);
  }
  function reportDamage(pc){
    if(!matric.trim()){ showToast("Masukkan no. matrik dahulu untuk lapor kerosakan.","err"); return; }
    const text=window.prompt(`Terangkan masalah pada ${pc.label}:`,"");
    if(!text || !text.trim()) return;
    const fresh=storageGet(KEY_REPORTS)||[];
    const entry={id:uid(),pcId:pc.id,pcLabel:pc.label,matric:matric.trim(),text:text.trim(),ts:Date.now(),resolved:false};
    const updatedReports=[entry,...fresh];
    const freshPcs=storageGet(KEY_PCS)||pcs;
    const updatedPcs=freshPcs.map(p=>p.id===pc.id?{...p,status:"maintenance",note:text.trim()}:p);
    storageSet(KEY_REPORTS,updatedReports); storageSet(KEY_PCS,updatedPcs);
    setReports(updatedReports); setPcs(updatedPcs);
    logAudit(matric.trim(),"Lapor Kerosakan",`${pc.label}: ${text.trim()}`);
    showToast("Laporan dihantar. Terima kasih!","ok");
  }
  function resolveReport(id){
    const fresh=storageGet(KEY_REPORTS)||reports;
    const updated=fresh.map(r=>r.id===id?{...r,resolved:true}:r);
    storageSet(KEY_REPORTS,updated); setReports(updated);
    logAudit("Admin","Selesai Laporan",id);
  }
  async function exportCSV(){
    try{
      const rows=[["Tarikh","Slot","PC","Nama","Matrik","Status","Sebab"]];
      (storageGet(KEY_BOOKINGS)||bookings).forEach(b=>rows.push([b.date,b.slot,b.pcLabel,b.name,b.matric,b.status,b.reason||""]));
      const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
      if(!window.claude || !window.claude.use){
        // fallback: fail dibuka terus di pelayar (bukan dalam Claude)
        const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a"); a.href=url; a.download="tempahan-pc.csv"; a.click();
        setTimeout(()=>URL.revokeObjectURL(url),1000);
        logAudit("Admin","Eksport CSV","tempahan-pc.csv");
        return;
      }
      const downloads=await window.claude.use("downloads");
      if(!downloads){ showToast("Ciri muat turun tak tersedia.","err"); return; }
      await downloads.save({filename:"tempahan-pc.csv",data:csv});
      logAudit("Admin","Eksport CSV","tempahan-pc.csv");
    }catch(e){ showToast("Gagal muat turun CSV.","err"); }
  }

  function updateSlots(next){
    const clean=[...new Set(next.map(s=>s.trim()).filter(Boolean))].sort();
    if(!clean.length){ showToast("Mesti ada sekurang-kurangnya satu slot.","err"); return; }
    if(storageSet(KEY_SLOTS,clean)){ setSlots(clean); showToast("Slot dikemas kini.","ok"); } else showToast("Gagal simpan.","err");
  }
  function toggleMaintenance(pc){ setBusy(true); const fresh=storageGet(KEY_PCS)||pcs;
    const nextStatus=pc.status==="maintenance"?"active":"maintenance";
    const updated=fresh.map(p=>p.id===pc.id?{...p,status:nextStatus,note:nextStatus==="active"?"":p.note}:p);
    if(storageSet(KEY_PCS,updated)){ setPcs(updated); logAudit("Admin","Togol Status PC",`${pc.label} → ${nextStatus}`); } setBusy(false); }
  function addPc(){ setBusy(true); const fresh=storageGet(KEY_PCS)||pcs; const n=fresh.length+1;
    const updated=[...fresh,{id:`pc-${n}-${uid()}`,label:`PC-${pad(n)}`,row:Math.floor((n-1)/6),col:(n-1)%6,status:"active"}];
    if(storageSet(KEY_PCS,updated)){ setPcs(updated); logAudit("Admin","Tambah PC",`PC-${pad(n)}`); } setBusy(false); }
  function removePc(pc){ setBusy(true); const fp=storageGet(KEY_PCS)||pcs; const up=fp.filter(p=>p.id!==pc.id);
    const fb=storageGet(KEY_BOOKINGS)||bookings; const ub=fb.filter(b=>b.pcId!==pc.id);
    storageSet(KEY_PCS,up); storageSet(KEY_BOOKINGS,ub); setPcs(up); setBookings(ub);
    logAudit("Admin","Buang PC",pc.label);
    if(selectedPcId===pc.id) setSelectedPcId(null); setBusy(false); }
  function exitAdmin(){ setRole("user"); setSelectedPcId(null); setAdminTab("bookings"); }
  function resetProfile(){ storageSet(KEY_PROFILE,{name:"",matric:""}); setName(""); setMatric(""); showToast("Disetkan semula.","ok"); }

  const rows=Math.max(0,...pcs.map(p=>p.row))+1, cols=Math.max(0,...pcs.map(p=>p.col))+1;
  const pendingCount=bookingsForDate.filter(b=>b.status==="pending"||b.status==="approved").length;

  return (
    <div className="lab-root">
      {!splashRemoved && (
        <div className={`splash ${splashActive?"":"splash-out"}`}>
          <div className="splash-icon">🖥️</div>
          <div className="splash-title">Makmal Komputer ADTEC JTM Kampus Tangkak</div>
          <div className="splash-sub">Sistem Tempahan PC</div>
          <div className="splash-bar"><div className="splash-bar-fill"></div></div>
        </div>
      )}
      {role==="__pin__" ? (
        <AdminLoginScreen onCancel={()=>setRole("user")} onSuccess={()=>setRole("admin")} />
      ) : role==="admin" ? (
        <AdminDashboardPage
          dates={dates} selectedDate={selectedDate} setSelectedDate={setSelectedDate} dash={dash}
          bookingsForDate={bookingsForDate} pendingCount={pendingCount} pcs={pcs} busy={busy}
          cancelBooking={cancelBooking} setBookingStatus={setBookingStatus} toggleMaintenance={toggleMaintenance}
          addPc={addPc} removePc={removePc} slots={slots} updateSlots={updateSlots} adminConfirmByCode={adminConfirmByCode}
          reports={reports} resolveReport={resolveReport} exportCSV={exportCSV} allBookings={bookings}
          adminTab={adminTab} setAdminTab={setAdminTab} exitAdmin={exitAdmin} theme={theme} setTheme={setTheme}
          refreshBookings={refreshBookings} rows={rows} cols={cols} activeBookingsForDate={activeBookingsForDate}
        />
      ) : (
        <>
          <header className="lab-header">
            <div><div className="lab-title">🖥️ Makmal Komputer ADTEC JTM Kampus Tangkak</div><div className="lab-sub">Sistem tempahan PC — pantauan masa nyata</div></div>
            <div style={{display:"flex",gap:6}}>
              <button className="chip-btn" onClick={()=>setRole("__pin__")}>🛡️ Admin</button>
              <button className="chip-btn" onClick={()=>setTheme(t=>t==="dark"?"light":"dark")} title="Togol tema">{theme==="dark"?"☀️":"🌙"}</button>
            </div>
          </header>

          <div className="dash">
            <div className="dash-card available"><div className="dash-num">{dash.available}</div><div className="dash-lbl">Available</div></div>
            <div className="dash-card pending"><div className="dash-num">{dash.pending}</div><div className="dash-lbl">Pending</div></div>
            <div className="dash-card confirmed"><div className="dash-num">{dash.confirmed}</div><div className="dash-lbl">Confirmed</div></div>
            <div className="dash-card maintenance"><div className="dash-num">{dash.maintenance}</div><div className="dash-lbl">Maintenance</div></div>
          </div>

          {showBanner && (
            <div className={`banner ${crit?"crit":""}`}>
              <span>⏰ {crit?"Sesi PC anda akan tamat SEBENTAR LAGI!":"Sesi PC anda akan tamat tidak lama lagi."} ({myActiveSession.pcLabel})</span>
              <b>{fmtRemain(remainMs)}</b>
            </div>
          )}

          <div className="main-tabs">
            <button className={`main-tab ${userTab==="book"?"active":""}`} onClick={()=>setUserTab("book")}>🖥️ Tempah PC</button>
            <button className={`main-tab ${userTab==="check"?"active":""}`} onClick={()=>setUserTab("check")}>📋 Semak Kelulusan</button>
          </div>

function QRImage({value,size=104}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!ref.current || !window.QRCode) return;
    ref.current.innerHTML="";
    new window.QRCode(ref.current,{text:value,width:size,height:size,colorDark:"#0A0E14",colorLight:"#ffffff"});
  },[value]);
  return <div ref={ref} className="qr-img-box"></div>;
}

function AdminLoginScreen({onCancel,onSuccess}){
  const [pin,setPin]=useState("");
  const [error,setError]=useState(false);
  const [shake,setShake]=useState(false);

  function press(d){ if(pin.length>=6) return; setPin(p=>p+d); setError(false); }
  function backspace(){ setPin(p=>p.slice(0,-1)); setError(false); }
  function submit(){
    if(!pin) return;
    const rec=storageGet(KEY_PIN)||{pin:"1234"};
    if(pin===rec.pin){ onSuccess(); }
    else{ setError(true); setShake(true); setTimeout(()=>setShake(false),350); setTimeout(()=>setPin(""),300); }
  }

  useEffect(()=>{
    function onKey(e){
      if(e.key>="0"&&e.key<="9") press(e.key);
      else if(e.key==="Backspace") backspace();
      else if(e.key==="Enter") submit();
      else if(e.key==="Escape") onCancel();
    }
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  });

  return (
    <div className="admin-gate">
      <div className={`admin-gate-card ${shake?"shakecard":""}`}>
        <div className="admin-gate-icon">🛡️</div>
        <div className="admin-gate-title">Portal Admin</div>
        <div className="admin-gate-sub">Masukkan PIN untuk urus makmal</div>
        <div className="pin-dots">
          {Array.from({length:Math.max(4,pin.length)}).map((_,i)=>(
            <span key={i} className={`pin-dot ${pin.length>i?"filled":""} ${error?"err":""}`}></span>
          ))}
        </div>
        <div className="admin-gate-error">{error?"PIN tidak sah, cuba lagi.":"\u00A0"}</div>
        <div className="pin-keypad">
          {["1","2","3","4","5","6","7","8","9"].map(d=>(
            <button key={d} className="pin-key" onClick={()=>press(d)}>{d}</button>
          ))}
          <button className="pin-key wide" onClick={()=>{setPin("");setError(false);}}>Kosong</button>
          <button className="pin-key" onClick={()=>press("0")}>0</button>
          <button className="pin-key wide" onClick={backspace}>⌫</button>
        </div>
        <button className="btn-primary" disabled={!pin} onClick={submit}>Masuk</button>
        <button className="admin-gate-back" onClick={onCancel}>← Kembali ke halaman pengguna</button>
      </div>
    </div>
  );
}

function AdminScanStation({onConfirm}){
  const videoRef=useRef(null); const canvasRef=useRef(null);
  const [active,setActive]=useState(false); const [error,setError]=useState("");
  const [feedback,setFeedback]=useState(null); const [manualCode,setManualCode]=useState("");

  useEffect(()=>{
    if(!active) return;
    let stream=null, raf=null, alive=true, cooldown=false;
    async function start(){
      try{
        stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
        if(!alive) return;
        if(videoRef.current){ videoRef.current.srcObject=stream; await videoRef.current.play(); }
        tick();
      }catch(e){ setError("Tidak dapat akses kamera pada peranti ini."); setActive(false); }
    }
    function tick(){
      if(!alive) return;
      const video=videoRef.current, canvas=canvasRef.current;
      if(video && canvas && video.readyState===video.HAVE_ENOUGH_DATA && window.jsQR && !cooldown){
        canvas.width=video.videoWidth; canvas.height=video.videoHeight;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const img=ctx.getImageData(0,0,canvas.width,canvas.height);
        const code=window.jsQR(img.data,img.width,img.height);
        if(code && code.data){
          cooldown=true;
          onConfirm(code.data,(msg,kind)=>setFeedback({msg,kind}));
          setTimeout(()=>{cooldown=false;},2000);
        }
      }
      raf=requestAnimationFrame(tick);
    }
    start();
    return ()=>{ alive=false; if(raf) cancelAnimationFrame(raf); if(stream) stream.getTracks().forEach(t=>t.stop()); };
  },[active]);

  return (
    <div>
      <p className="muted">Buka kamera di kaunter/pintu makmal. Minta pengguna tunjuk kod QR mereka untuk didaftar masuk.</p>
      {!active ? (
        <button className="btn-secondary" onClick={()=>{setError("");setFeedback(null);setActive(true);}}>📷 Buka Kamera Stesen</button>
      ) : (
        <>
          {error ? <p className="muted" style={{color:"var(--danger)"}}>{error}</p> : <video ref={videoRef} muted playsInline className="cam-video"></video>}
          <canvas ref={canvasRef} style={{display:"none"}}></canvas>
          <button className="chip-btn" style={{marginTop:8}} onClick={()=>setActive(false)}>✕ Tutup Kamera</button>
        </>
      )}
      {error && !active && <p className="muted" style={{color:"var(--danger)"}}>{error}</p>}
      {feedback && <div className={`scan-feedback ${feedback.kind}`}>{feedback.msg}</div>}
      <div className="divider"></div>
      <div className="panel-eyebrow">Sandaran</div>
      <div className="qr-row">
        <input value={manualCode} onChange={e=>setManualCode(e.target.value)} placeholder="Masukkan kod QR manual"/>
        <button className="mini-btn approve" onClick={()=>{ if(manualCode.trim()){ onConfirm(manualCode,(msg,kind)=>setFeedback({msg,kind})); setManualCode(""); } }}>Sahkan</button>
      </div>
    </div>
  );
}

            const totalMs = SESSION_MS+(b.extraMs||0);
            const sessionLeft = b.status==="confirmed" && b.qrConfirmedAt ? Math.max(0, b.qrConfirmedAt+totalMs-now) : null;
            const sessionPct = sessionLeft!==null ? Math.max(0,Math.min(100,(sessionLeft/totalMs)*100)) : null;
            const barColor = sessionLeft!==null ? (sessionLeft<=60000?"var(--danger)":sessionLeft<=300000?"var(--pending)":"var(--confirmed)") : "";
            return (
              <li key={b.id}>
                <div className="mb-row">

                    <div className="mb-row" style={{marginBottom:4}}>
                      <span className="qr-code-hint">Tempoh sesi: {Math.round(totalMs/60000)} minit</span>

          <div className="ab-row"><div><div className="ab-top">{r.pcLabel}</div><div className="ab-sub">{r.matric} · {new Date(r.ts).toLocaleString("ms-MY")}</div></div>
            <button className="mini-btn approve" onClick={()=>resolveReport(r.id)}>✓ Selesai</button></div>
          <div className="muted">{r.text}</div>
        </div>
      ))}
      {done.length>0 && <><div className="divider"></div><p className="panel-eyebrow">Selesai ({done.length})</p>
        {done.slice(0,10).map(r=> <div key={r.id} className="audit-item"><b>{r.pcLabel}</b> — {r.text}</div>)}
      </>}
    </div>
  );
}

function AnalyticsPanel({bookings,exportCSV}){
  const audit=useMemo(()=>storageGet(KEY_AUDIT)||[],[bookings]);
  const stats=useMemo(()=>{
    const total=bookings.length;
    const completed=bookings.filter(b=>b.reason==="Sesi tamat"||b.reason==="Sesi ditamatkan awal oleh pengguna").length;
    const autoReleased=bookings.filter(b=>(b.reason||"").startsWith("Dilepaskan automatik")).length;
    const pcCounts={};
    bookings.forEach(b=>{ if(b.qrConfirmedAt) pcCounts[b.pcLabel]=(pcCounts[b.pcLabel]||0)+1; });
    let topPc="—",topN=0;
    Object.entries(pcCounts).forEach(([k,v])=>{ if(v>topN){topPc=k;topN=v;} });
    const hourCounts={};
    bookings.forEach(b=>{ const h=b.slot.slice(0,2); hourCounts[h]=(hourCounts[h]||0)+1; });
    let peakHour="—",peakN=0;
    Object.entries(hourCounts).forEach(([k,v])=>{ if(v>peakN){peakHour=k+":00";peakN=v;} });
    return {total,completed,autoReleased,topPc,peakHour};
  },[bookings]);
  return (
    <div>
      <div className="stat-grid">
        <div className="stat-box"><div className="n">{stats.total}</div><div className="l">Jumlah Tempahan</div></div>
        <div className="stat-box"><div className="n">{stats.completed}</div><div className="l">Sesi Selesai</div></div>
        <div className="stat-box"><div className="n">{stats.autoReleased}</div><div className="l">Auto-Release (No-Show)</div></div>
        <div className="stat-box"><div className="n">{stats.topPc}</div><div className="l">PC Paling Popular</div></div>
      </div>
      <p className="muted">Waktu puncak: <b>{stats.peakHour}</b></p>
      <button className="btn-primary" onClick={exportCSV}>⬇ Muat Turun CSV</button>
      <div className="divider"></div>
      <p className="panel-eyebrow">Log Audit (terkini)</p>
      {audit.length===0 ? <p className="muted">Tiada rekod lagi.</p> : audit.slice(0,20).map(a=>(
        <div key={a.id} className="audit-item"><b>{a.actor}</b> · {a.action} — {a.detail} <span style={{float:"right"}}>{new Date(a.ts).toLocaleTimeString("ms-MY")}</span></div>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<LabReservation />);
</script>
</body>
</html>
